{{- if .Values.ingress.enabled }}
{{- $c := .Values.ingress -}}
{{- if not $c.host }}
{{- fail "ingress.host is required when ingress.enabled=true" }}
{{- end }}
# Optional public exposure (default: tailnet only through the fixed ClusterIP).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    {{- include "lfw.labels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $c.clusterIssuer | quote }}
    {{- with $c.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $c.className }}
  tls:
    - hosts:
        - {{ $c.host | quote }}
      secretName: {{ $c.tlsSecretName }}
  rules:
    - host: {{ $c.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
{{- end }}

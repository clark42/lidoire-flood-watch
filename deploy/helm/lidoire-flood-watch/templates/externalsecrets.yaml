{{- $es := .Values.externalSecrets -}}
{{- /*
Raw generated secrets, consumed by postgres, influxdb, redis and the backup.
API_KEY is deliberately left out (only the backend needs it).
*/}}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "lfw.generatedSecret" . }}
  labels:
    {{- include "lfw.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "lfw.generatedSecret" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: {{ `"{{ .POSTGRES_PASSWORD }}"` }}
        INFLUXDB_ADMIN_PASSWORD: {{ `"{{ .INFLUXDB_ADMIN_PASSWORD }}"` }}
        INFLUXDB_ADMIN_TOKEN: {{ `"{{ .INFLUXDB_ADMIN_TOKEN }}"` }}
        REDIS_PASSWORD: {{ `"{{ .REDIS_PASSWORD }}"` }}
  dataFrom:
    - extract:
        key: {{ $es.generated.remoteKey | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
{{- /*
Backend connection settings. The URLs are assembled by the ESO template from
the remote JSON: no password is ever rendered by Helm. Passwords are
URL-encoded (urlquery) so any generated character set stays valid.
INFLUXDB_TOKEN = admin token (a bucket-scoped token can replace it later).
*/}}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "lfw.backendSecret" . }}
  labels:
    {{- include "lfw.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "lfw.backendSecret" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: {{ printf "\"postgresql+asyncpg://%s:{{ .POSTGRES_PASSWORD | urlquery }}@postgres:5432/%s\"" .Values.postgres.user .Values.postgres.database }}
        REDIS_URL: {{ `"redis://:{{ .REDIS_PASSWORD | urlquery }}@redis:6379/0"` }}
        INFLUXDB_TOKEN: {{ `"{{ .INFLUXDB_ADMIN_TOKEN }}"` }}
        API_KEY: {{ `"{{ .API_KEY }}"` }}
  dataFrom:
    - extract:
        key: {{ $es.generated.remoteKey | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- if .Values.externalApis.enabled }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "lfw.externalApisSecret" . }}
  labels:
    {{- include "lfw.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "lfw.externalApisSecret" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.externalApis.remoteKey | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
{{- if .Values.backup.enabled }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "lfw.backupSecret" . }}
  labels:
    {{- include "lfw.labels" (dict "ctx" $ "component" "backup") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ include "lfw.backupSecret" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.backup.remoteKey | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}

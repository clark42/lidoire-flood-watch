{{- $c := .Values.frontend -}}
{{- $tls := .Values.tls -}}
# Fixed ClusterIP announced on the headscale tailnet (subnet router 10.32.0.0/20).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "lfw.labels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  {{- with $c.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    {{- include "lfw.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
    {{- if $tls.enabled }}
    - name: https
      port: {{ $c.service.httpsPort }}
      targetPort: https
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "lfw.labels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "lfw.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lfw.labels" (dict "ctx" $ "component" "frontend") | nindent 8 }}
      {{- if $tls.enabled }}
      annotations:
        # Roll the pod when the nginx TLS snippet changes (the certificate
        # itself is picked up by the periodic reload, no restart)
        checksum/nginx-tls: {{ include "lfw.frontendTlsSnippet" $ | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "lfw.podSecurityContext" $c.securityContext | nindent 8 }}
      {{- include "lfw.podScheduling" $ | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "lfw.appImage" (dict "ctx" $ "repository" $c.image.repository) }}
          imagePullPolicy: {{ include "lfw.appImagePullPolicy" $ }}
          securityContext:
            {{- include "lfw.containerSecurityContext" $ | nindent 12 }}
          env:
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
            {{- if $tls.enabled }}
            # frontend/docker-entrypoint.d/90-lfw-tls-reload.sh
            - name: LFW_TLS_RELOAD_INTERVAL
              value: {{ $tls.reloadIntervalSeconds | int | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if $tls.enabled }}
            - name: https
              containerPort: 8443
            {{- end }}
          {{- /* With TLS, 8080 redirects every path: probe the TLS server */}}
          readinessProbe:
            httpGet:
              path: /index.html
              {{- if $tls.enabled }}
              port: https
              scheme: HTTPS
              {{- else }}
              port: http
              {{- end }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              {{- if $tls.enabled }}
              port: https
              scheme: HTTPS
              {{- else }}
              port: http
              {{- end }}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            # pid file and proxy/client temp paths of nginx-unprivileged
            - name: tmp
              mountPath: /tmp
            {{- if $tls.enabled }}
            # Server-level include of frontend/nginx.conf (listen 8443 ssl)
            - name: nginx-tls
              mountPath: /etc/nginx/server.d
              readOnly: true
            # Whole directory, no subPath: the kubelet updates the files in
            # place when cert-manager renews the certificate
            - name: tls-cert
              mountPath: /etc/nginx/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if $tls.enabled }}
        - name: nginx-tls
          configMap:
            name: frontend-nginx-tls
        # Created by cert-manager (Certificate frontend-tls): the pod waits in
        # ContainerCreating until the first issuance
        - name: tls-cert
          secret:
            secretName: {{ $tls.secretName }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}

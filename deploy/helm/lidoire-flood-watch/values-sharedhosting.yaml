# Scaleway Kapsule "sharedhosting" (context admin@sharedhosting-production).
# The chart defaults already target this cluster; this file pins the
# environment-specific bindings (created by the Terraform stack 11-lidoire)
# so that they stay explicit if the defaults evolve.
#
#   helm upgrade --install lidoire deploy/helm/lidoire-flood-watch -n lidoire \
#     -f deploy/helm/lidoire-flood-watch/values-sharedhosting.yaml \
#     --set image.tag=sha-$(git rev-parse --short=7 HEAD) \
#     --kube-context admin@sharedhosting-production

externalSecrets:
  secretStoreRef:
    kind: ClusterSecretStore
    name: scaleway-secret-manager

frontend:
  service:
    clusterIP: 10.32.0.100

# HTTPS on the tailnet, terminated by the frontend nginx (Service frontend
# 443 -> 8443, 80 -> 8080 answers 301). Certificate by DNS-01 (Cloudflare).
tls:
  enabled: true
  host: lidoire.ts.kamorion.cloud
  issuer: letsencrypt-dns01-cloudflare
  issuerKind: ClusterIssuer

backend:
  config:
    frontendUrl: "https://lidoire.ts.kamorion.cloud"
    # http origin kept during the switch to https (cached tabs, old links)
    corsOrigins: "https://lidoire.ts.kamorion.cloud,http://lidoire.ts.kamorion.cloud"
  # Owner-approved alert policy (scripts/eval/budget.py): ntfy alerts from
  # v3.4 red (>= 55) only, downgrade sent after 12 h (~6 alerts/yr, 5/5 floods
  # on the replay). Plain env wins over the external-apis Secret (envFrom).
  extraEnv:
    - name: NOTIFY_MIN_LEVEL
      value: "red"
    - name: NOTIFY_DOWNGRADE_HOLD_HOURS
      value: "12"
  persistence:
    storageClass: sbs-default-retain

postgres:
  persistence:
    storageClass: sbs-default-retain

influxdb:
  persistence:
    storageClass: sbs-default-retain

# Scaleway secret lidoire-external-apis (Infoclimat, Netatmo, ntfy keys).
# Without it the backend runs with no external API keys.
externalApis:
  enabled: true
